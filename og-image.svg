<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="10%">
      <stop offset="0%" stop-color="#ff7f50" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#ff7f50" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="85%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
