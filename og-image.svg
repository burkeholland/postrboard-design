  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <!-- Wordmark -->
  <text x="100" y="220" font-family="monospace" font-size="82" font-weight="700" letter-spacing="-6" fill="#e2e8f0">postrboard</text>
  <!-- Tagline -->
  <text x="100" y="310" font-family="system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="-2" fill="#ffffff">Quiet CSS for loud products.</text>
  <!-- Subtitle -->
  <text x="100" y="380" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8">A refined, airy, code-native CSS framework.</text>
  <text x="100" y="420" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8">Zero JavaScript. Zero build step. Just link and ship.</text>
  <!-- Stats -->
  <text x="100" y="520" font-family="monospace" font-size="16" fill="#64748b">710 lines · 44KB minified · 0 dependencies · Light + Dark</text>
